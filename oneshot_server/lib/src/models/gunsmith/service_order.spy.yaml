class: ServiceOrder
table: service_orders
fields:
  id: UuidValue, defaultModel=random
  clientId: UuidValue?
  client: GunsmithClient?, relation(optional)
  firearmId: UuidValue?
  firearm: Firearm?, relation(optional)
  entryDate: DateTime
  estimatedDeliveryDate: DateTime?
  totalPrice: double
  discount: double?
  finalPrice: double
  paymentMethod: String?
  notes: String?
indexes:
  service_order_client_id_idx:
    fields: clientId
  service_order_entry_date_idx:
    fields: entryDate