class: ServiceOrderItem
table: service_order_items
fields:
  id: UuidValue, defaultModel=random
  serviceOrder: ServiceOrder?, relation(optional)
  description: String
  isStockPart: bool
  supplyPart: SupplyStock?, relation(optional)
  servicePrice: double
indexes:
  service_order_item_order_id_idx:
    fields: serviceOrderId