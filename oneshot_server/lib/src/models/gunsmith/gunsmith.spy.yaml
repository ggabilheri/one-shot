class: Gunsmith
table: gunsmiths
fields:
  id: UuidValue, defaultModel=random
  name: String
  taxId: String
  address: Address?, relation(optional)
  owner: UserProfile?, relation(optional)
  active: bool, default=true
indexes:
  gunsmith_tax_id_idx:
    fields: taxId
    unique: true
  gunsmith_owner_id_idx:
    fields: ownerId
