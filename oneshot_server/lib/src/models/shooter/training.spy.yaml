class: Training
table: trainings
fields:
  id: UuidValue, defaultModel=random
  userInfo: module:auth:UserInfo?, relation(optional)
  date: DateTime
  location: String
  environmentType: String    
  firearm: Firearm?, relation(optional)
  ammunition: AmmunitionStock?, relation(optional)
  shotsFired: int
  distanceMeters: double
  score: int?
  targetImagesUrl: String?
indexes:
  training_user_id_idx:
    fields: userInfoId
  training_date_idx:
    fields: date