class: ReloadSession
table: reload_sessions
fields:
  id: UuidValue, defaultModel=random
  userInfo: module:auth:UserInfo?, relation(optional)
  reloadDate: DateTime
  press: Accessory?, relation(optional)
  caliber: String
  casingBatch: String
  reloadsCompleted: int
  powder: SupplyStock?, relation(optional)
  powderGrains: double
  primer: SupplyStock?, relation(optional)
  projectile: SupplyStock?, relation(optional)
  oal: double             
  totalCost: double
  unitCost: double
indexes:
  reload_session_user_id_idx:
    fields: userInfoId
  reload_session_date_idx:
    fields: reloadDate