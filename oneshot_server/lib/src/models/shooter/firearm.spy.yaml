class: Firearm
table: firearms
fields:
  id: UuidValue, defaultModel=random
  user: UserProfile?, relation(optional)
  
  # Technical fields
  purpose: FirearmPurpose
  type: FirearmType
  action: FirearmAction
  usageType: UsageType
  serialNumber: String
  manufactureCountry: String
  manufacturer: String
  model: String
  bolt: String?
  frame: String?
  grip: String?
  conservationState: ConservationState
  caliber: String
  barrelsCount: int?
  barrelLength: String?
  soulType: String?
  sightType: String?
  riflingCount: int?
  riflingDirection: String?
  magazineCapacity: int
  magazineCount: int?
  dimensions: String?     # A x C x L
  weight: double?
  
  # History and Value
  acquisitionDate: DateTime?
  purchasePrice: double?
  saleDate: DateTime?
  salePrice: double?
  buyerData: String?
  customizations: String?
  images: List<String>?
  cleaningHistory: String?
  maintenanceHistory: String?
  totalShots: int?

indexes:
  firearm_user_id_idx:
    fields: userId
  firearm_serial_number_idx:
    fields: serialNumber
    unique: true
