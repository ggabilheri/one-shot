class: Club
table: clubs
fields:
  id: UuidValue, defaultModel=random
  name: String
  cnpj: String
  address: Address?, relation(optional)
  owner: UserProfile?, relation(optional)
  phoneNumber: String?
  email: String?
  active: bool, default=true
  incomeValue: double, default=1000.00

  # Campos do gateway Asaas (subconta)
  asaasAccountId: String?              # ID da subconta no Asaas
  asaasWalletId: String?               # Wallet ID para split de pagamentos
  asaasApiKey: String?                 # API key da subconta
  asaasOnboardingFailureReason: String? # Motivo da falha no cadastro Asaas

indexes:
  club_cnpj_idx:
    fields: cnpj
    unique: true
  club_owner_id_idx:
    fields: ownerId
