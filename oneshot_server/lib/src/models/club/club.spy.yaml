class: Club
table: clubs
fields:
  id: UuidValue, defaultModel=random
  name: String
  cnpj: String
  addressId: UuidValue?
  address: Address?, relation(optional)
  ownerId: UuidValue?
  owner: UserProfile?, relation(optional)
  phoneNumber: String?
  email: String?
  active: bool, default=true
indexes:
  club_cnpj_idx:
    fields: cnpj
    unique: true
  club_owner_id_idx:
    fields: ownerId
