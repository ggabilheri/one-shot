class: Membership
table: memberships
fields:
  id: UuidValue, defaultModel=random
  user: UserProfile?, relation(optional)
  club: Club?, relation(optional)
  membershipNumber: String?
  startDate: DateTime
  validUntil: DateTime?
  status: MembershipStatus, default=active
  planName: String?
indexes:
  membership_user_club_idx:
    fields: userId, clubId
    unique: true
  membership_club_idx:
    fields: clubId
