class: Membership
table: memberships
fields:
  id: UuidValue?,  defaultPersist=random
  userId: UuidValue?
  user: UserProfile?, relation
  clubId: UuidValue?
  club: Club?, relation
  membershipNumber: String?
  startDate: DateTime
  validUntil: DateTime?
  status: MembershipStatus, default=active
  planName: String?
indexes:
  membership_user_club_idx:
    fields: userId, clubId
    unique: true
  membership_club_idx:
    fields: clubId
