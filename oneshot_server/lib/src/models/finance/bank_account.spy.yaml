class: BankAccount
table: bank_accounts
fields:
  id: UuidValue, defaultModel=random
  name: String            # Ex: Conta Nubank, Caixa Físico
  bankName: String?       # Ex: Nubank, Itaú
  agency: String?
  agencyDigit: String?
  accountNumber: String?
  accountDigit: String?
  balance: double         # Saldo atual da conta
  status: String          # ACTIVE, INACTIVE
  originModule: String    # BACKOFFICE, CLUB, GUNSMITH
  company: Company?, relation(optional)
  pixKey: String?
  pixKeyType: PixKeyType?
indexes:
  bank_account_origin_idx:
    fields: originModule
  bank_account_status_idx:
    fields: status