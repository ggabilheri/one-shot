class: SupplyStock
table: supply_stocks
fields:
  id: UuidValue, defaultModel=random
  name: String
  type: String         # Case, Primer, Powder, Bullet
  quantity: double
  unit: String         # Units, Grams, Grains
  acquisitionDate: DateTime?
  batchNumber: String?
  userInfo: module:auth:UserInfo?, relation(optional)
indexes:
  supply_stock_user_id_idx:
    fields: userInfoId
