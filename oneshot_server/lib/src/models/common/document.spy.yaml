class: Document
table: documents
fields:
  id: UuidValue, defaultModel=random
  user: UserProfile?, relation
  firearm: Firearm?, relation(optional)
  accessory: Accessory?, relation(optional)
  
  # Fields
  type: DocumentType
  registryBody: RegistryBody
  number: String
  emissionDate: DateTime
  expirationDate: DateTime?
  filePath: String?
  
  # Supplier Info
  supplierName: String?
  supplierCpfCnpj: String?
  supplierPhone: String?
  supplierAddress: String?

indexes:
  document_user_id_idx:
    fields: userId
  document_number_idx:
    fields: number
  document_firearm_id_idx:
    fields: firearmId
  document_accessory_id_idx:
    fields: accessoryId