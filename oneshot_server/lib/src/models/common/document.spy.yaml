class: Document
table: documents
fields:
  id: UuidValue, defaultModel=random
  userId: UuidValue?
  userInfo: module:auth:UserInfo?, relation(optional)
  firearmId: UuidValue?
  firearm: Firearm?, relation(optional)(optional)
  accessoryId: UuidValue?
  accessory: Accessory?, relation(optional)(optional)
  documentType: String   
  registryAgency: String   
  documentNumber: String
  issueDate: DateTime
  expirationDate: DateTime
  documentImageUrl: String?
  supplierName: String?
  supplierAddressId: UuidValue?
  supplierAddress: Address?, relation(optional)(optional)
indexes:
  document_user_id_idx:
    fields: userId
  document_firearm_id_idx:
    fields: firearmId
  document_expiration_date_idx:
    fields: expirationDate