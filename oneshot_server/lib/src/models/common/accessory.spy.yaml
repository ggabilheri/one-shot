class: Accessory
table: accessories
fields:
  id: UuidValue, defaultModel=random
  user: UserProfile?, relation
  firearm: Firearm?, relation(optional)
  
  # Technical Fields
  purpose: String?
  type: AccessoryType
  serialNumber: String?
  manufactureCountry: String?
  manufacturer: String?
  model: String?
  description: String?
  conservationState: ConservationState?
  usageType: UsageType?
  dimensions: String?
  weight: double?
  color: String?
  finishMaterial: String?
  
  # History and Value
  acquisitionDate: DateTime?
  purchasePrice: double?
  invoiceNumber: String?
  invoiceEmissionDate: DateTime?
  sellerData: String?      # Seller/CNPJ
  registryBody: RegistryBody?
  customizations: String?
  maintenanceHistory: String?
  images: List<String>?

indexes:
  accessory_user_id_idx:
    fields: userId
  accessory_firearm_id_idx:
    fields: firearmId
  accessory_serial_number_idx:
    fields: serialNumber