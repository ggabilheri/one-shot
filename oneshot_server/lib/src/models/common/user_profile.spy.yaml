class: UserProfile
table: user_profile
fields:
  id: UuidValue, defaultModel=random
  userInfo: module:auth:UserInfo?, relation(optional)
  name: String
  gender: Gender?
  birthDate: DateTime?
  rg: String?
  cpf: String?
  phone: String?
  email: String?
  address: Address?, relation(optional)
  types: List<UserType>?
  status: UserStatus

  # Campos do gateway Asaas
  asaasCustomerId: String?              # ID do customer no Asaas
  asaasOnboardingFailureReason: String? # Motivo da falha no cadastro Asaas
indexes:
  user_cpf_idx:
    fields: cpf
    unique: true
  user_email_idx:
    fields: email
