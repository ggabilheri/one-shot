class: UserProfile
table: user_profile
fields:
  id: UuidValue, defaultModel=random
  userInfo: module:auth:UserInfo?, relation(optional)(optional)
  name: String
  cpf: String?
  cr: String?
  address: Address?, relation(optional)(optional)
  types: List<UserType>?
indexes:
  user_cpf_idx:
    fields: cpf
    unique: true
  user_address_id_idx:
    fields: addressId  
