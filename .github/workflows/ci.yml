name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  server:
    name: Server (analyze + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: oneshot_user
          POSTGRES_DB: oneshot_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 9090:5432
        options: >-
          --health-cmd "pg_isready -U oneshot_user -d oneshot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13

      - name: Create test passwords file
        working-directory: oneshot_server
        run: |
          cat > config/passwords.yaml << 'EOF'
          test:
            database: "test_password"
          EOF

      - name: Get dependencies
        working-directory: oneshot_server
        run: dart pub get

      - name: Analyze
        working-directory: oneshot_server
        run: dart analyze

      - name: Run tests
        working-directory: oneshot_server
        run: dart test

  apps:
    name: Apps (analyze + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [shooter_app, backoffice_web, company_portal]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
